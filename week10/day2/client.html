<script>

    const socket =io("//localhost:8080/");


     // Sending 
    socket.emit("gyankibaat", "welcome to socket.io server");

    // Reading
    socket.on("gyankibaat", (msg) => {
        console.log("Message from server", msg);
    });
    
    //ReadingBroading
    socket.on("join", (msg)=> {
        console.log("Message from server", msg);
    })

    //Reading Broading
    socket.io("announcement", (msg)=>{
        console.log("Message from server",msg);
    })
</script>
